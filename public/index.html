<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="kitsbase: 팀이 함께 쓰는 사업 캘린더"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%225%22 fill=%22%23DD3A2E%22/%3E%3Cpath d=%22M6 8h12v10H6zM6 11h12M9 6v3M15 6v3%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>kitsbase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left rail (bottom tab bar on phones) + one working canvas; the calendar is home, a day panel rides on its right. */
:root{
  --bg:#F6F4F3; --surface:#FFFFFF; --surface-2:#F0ECEA; --line:#E3DCD9; --line-strong:#CFC5C1;
  --ink:#1E191A; --ink-2:#5B5153; --ink-3:#8C8183;
  --accent:#DD3A2E; --accent-ink:#FFFFFF; --accent-soft:#FBE6E2; --accent-line:#F2B9B0;
  --today:#1E191A; --today-ink:#FFFFFF;
  --k-event:#2F6FDB; --k-idea:#D88A10; --k-mission:#7A4FD6; --k-decision:#20925E;
  --danger:#C7362B; --ok:#20925E;
  --shadow:0 1px 2px rgba(40,20,20,.06),0 8px 24px rgba(40,20,20,.07);
  --stage-bg:#140C0C; --stage-ink:#FBEFEA; --stage-ink-2:#C9A9A0; --stage-line:#3A2422;
  --f-display:"Bricolage Grotesque","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px; --rail:228px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --surface:#1C1819; --surface-2:#262022; --line:#352D2F; --line-strong:#4A3F41;
  --ink:#F4EFED; --ink-2:#C0B5B3; --ink-3:#8D8183;
  --accent:#FF5B4B; --accent-ink:#1A0B09; --accent-soft:#3B1E1B; --accent-line:#7A3129;
  --today:#F4EFED; --today-ink:#141112;
  --k-event:#6EA2FF; --k-idea:#F2B24B; --k-mission:#A887FF; --k-decision:#4CC58C;
  --danger:#FF6B5E; --ok:#4CC58C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141112; --surface:#1C1819; --surface-2:#262022; --line:#352D2F; --line-strong:#4A3F41;
  --ink:#F4EFED; --ink-2:#C0B5B3; --ink-3:#8D8183;
  --accent:#FF5B4B; --accent-ink:#1A0B09; --accent-soft:#3B1E1B; --accent-line:#7A3129;
  --today:#F4EFED; --today-ink:#141112;
  --k-event:#6EA2FF; --k-idea:#F2B24B; --k-mission:#A887FF; --k-decision:#4CC58C;
  --danger:#FF6B5E; --ok:#4CC58C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 10.5px/1.2 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:22px;padding:20px 14px 18px max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.brand-name{font:800 22px/1 var(--f-display);letter-spacing:-.03em}
.brand-name b{color:var(--accent);font-weight:800}
.brand small{display:block;font:500 10px/1.3 var(--f-mono);color:var(--ink-3);letter-spacing:.08em;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .eyebrow{padding:0 10px 8px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:600;text-align:left}
.nav button svg{flex:none}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.active{background:var(--accent-soft);color:var(--accent)}
.nav button .count{margin-left:auto;font:600 11px var(--f-mono);color:var(--ink-3)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 6px}
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.sync.live i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}
.sync.local i{background:var(--k-idea)}
.sync small{display:block;color:var(--ink-3);font-size:11px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.topbar .mobile-brand{display:none}
.page-title{min-width:0}
.page-title h1{font:800 20px/1.1 var(--f-display);letter-spacing:-.02em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{position:relative}
.search label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:0 10px;height:36px;width:min(280px,40vw);color:var(--ink-3)}
.search input{border:0;background:none;outline:none;min-width:0;flex:1;color:var(--ink)}
.search-results,.bell-panel{position:absolute;right:0;top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));max-height:420px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;z-index:40}
.search-results button,.bell-panel button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;border-radius:7px;padding:8px}
.search-results button:hover,.bell-panel button:hover{background:var(--surface-2)}
.search-results .empty,.bell-panel .empty{padding:14px;color:var(--ink-3);font-size:13px}
.res-tag{font:600 10px/1.6 var(--f-mono);letter-spacing:.06em;padding:0 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);flex:none;margin-top:2px}
.res-main{min-width:0}
.res-main strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-main span{display:block;font-size:12px;color:var(--ink-3)}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--line-strong)}
.icon-btn .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--danger);background:none}
.btn.sm{height:30px;padding:0 10px;font-size:13px;border-radius:7px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.view{padding-block:22px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
.tabbar{display:none}

/* ---------- calendar ---------- */
.cal-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.cal-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.cal-head h2{font:800 clamp(26px,3.2vw,38px)/1 var(--f-display);letter-spacing:-.03em}
.cal-head h2 span{color:var(--ink-3);font-weight:600}
.cal-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:2px}
.seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:7px;color:var(--ink-2);font-weight:600;font-size:13px}
.seg button.active{background:var(--ink);color:var(--bg)}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);height:36px}
.stepper button{border:0;background:none;width:34px;height:34px;display:grid;place-items:center;color:var(--ink-2)}
.stepper button.today-btn{width:auto;padding:0 10px;font-weight:600;font-size:13px;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;color:var(--ink-2)}
.chip i{width:9px;height:9px;border-radius:3px;background:var(--c,var(--ink-3))}
.chip span{font:600 11px var(--f-mono);color:var(--ink-3)}
.chip.active{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.search-note{display:flex;align-items:center;gap:8px;margin:-4px 0 12px;font-size:13px;color:var(--ink-2)}

.month{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--line)}
.weekdays span{padding:8px 10px;font:600 11px var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.weekdays span:first-child{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;position:relative}
.day:nth-child(7n){border-right:0}
.day:nth-last-child(-n+7){border-bottom:0}
.day:hover{background:color-mix(in srgb,var(--surface-2) 60%,transparent)}
.day.muted{background:color-mix(in srgb,var(--surface-2) 45%,transparent)}
.day.muted .num{color:var(--ink-3)}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.num{font:600 12.5px/1 var(--f-mono);width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--ink-2)}
.day.sun .num{color:var(--accent)}
.day.today .num{background:var(--today);color:var(--today-ink)}
.pill{display:flex;align-items:center;gap:5px;border:0;width:100%;text-align:left;border-radius:5px;padding:2px 6px;font-size:12px;font-weight:600;line-height:1.35;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);min-width:0}
.pill::before{content:"";width:3px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill time{font:500 10.5px var(--f-mono);color:var(--ink-3);flex:none}
.pill:hover{background:color-mix(in srgb,var(--c) 24%,var(--surface))}
.more{font-size:11.5px;color:var(--ink-3);font-weight:600;padding-left:6px;border:0;background:none;text-align:left}
.kind{display:inline-flex;align-items:center;font:600 10px/1.7 var(--f-mono);letter-spacing:.04em;padding:0 6px;border-radius:4px;color:var(--kc);background:color-mix(in srgb,var(--kc) 13%,transparent);flex:none}
.kind.event{--kc:var(--k-event)} .kind.idea{--kc:var(--k-idea)} .kind.mission{--kc:var(--k-mission)} .kind.decision{--kc:var(--k-decision)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wcol{border-right:1px solid var(--line);min-height:420px;display:flex;flex-direction:column;min-width:0}
.wcol:last-child{border-right:0}
.wcol header{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.wcol header span{font:600 11px var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.wcol header strong{display:block;font:800 22px/1.1 var(--f-display)}
.wcol.today header strong{color:var(--accent)}
.wcol.sel header{background:var(--accent-soft)}
.wcol .wlist{padding:8px;display:flex;flex-direction:column;gap:6px}
.wcard{border:0;text-align:left;border-radius:7px;padding:7px 8px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-left:3px solid var(--c);display:flex;flex-direction:column;gap:2px;min-width:0}
.wcard time{font:500 11px var(--f-mono);color:var(--ink-3)}
.wcard strong{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.wcard small{color:var(--ink-3);font-size:11.5px}
.wadd{border:1px dashed var(--line-strong);background:none;border-radius:7px;color:var(--ink-3);padding:5px;font-size:12px}

.agenda{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.agenda-day{display:grid;grid-template-columns:92px minmax(0,1fr);border-bottom:1px solid var(--line)}
.agenda-day:last-child{border-bottom:0}
.agenda-date{padding:14px;border-right:1px solid var(--line)}
.agenda-date strong{display:block;font:800 26px/1 var(--f-display)}
.agenda-date span{font:600 11px var(--f-mono);color:var(--ink-3)}
.agenda-date.today strong{color:var(--accent)}
.agenda-rows{padding:6px}
.arow{display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;cursor:pointer;min-width:0}
.arow:hover{background:var(--surface-2)}
.arow .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.arow time{font:500 12px var(--f-mono);color:var(--ink-3);width:44px;flex:none}
.arow .t{min-width:0;flex:1}
.arow .t strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .t span{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty-block{padding:36px 20px;text-align:center;color:var(--ink-3);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty-block strong{color:var(--ink);font-size:15px}

.side{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.dayhead{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line)}
.datetile{width:52px;height:56px;border-radius:9px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
.datetile strong{font:800 24px/1 var(--f-display)}
.datetile span{font:600 10px var(--f-mono);letter-spacing:.06em;opacity:.75}
.dayhead h3{font-size:16px;font-weight:700}
.dayhead .btn{margin-left:auto}
.daylist{padding:6px;display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto}
.ditem{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:7px;cursor:pointer;min-width:0}
.ditem:hover{background:var(--surface-2)}
.ditem .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none}
.ditem .t{min-width:0;flex:1}
.ditem .t strong{display:block;font-weight:600;overflow-wrap:anywhere}
.ditem .t span{font-size:12px;color:var(--ink-3)}
.ditem .x{border:0;background:none;color:var(--ink-3);padding:2px;border-radius:5px}
.ditem .x:hover{color:var(--danger)}
.panel-empty{padding:18px;color:var(--ink-3);font-size:13px;text-align:center}
.biz-head{padding:14px 14px 10px;display:flex;align-items:baseline;gap:8px}
.biz-head h3{font-size:15px;font-weight:700}
.biz-head span{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--ink-3)}
.biz{border-top:1px solid var(--line)}
.biz-row{display:flex;align-items:center;gap:6px;padding:8px 10px}
.biz-toggle{display:flex;align-items:center;gap:9px;border:0;background:none;flex:1;min-width:0;text-align:left;padding:2px}
.biz-toggle .dot{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.biz-toggle .nm{min-width:0;flex:1}
.biz-toggle small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.08em;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz-toggle strong{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.biz-toggle em{font:600 11px var(--f-mono);font-style:normal;color:var(--ink-3)}
.biz-toggle svg{transition:transform .15s;color:var(--ink-3)}
.biz.open .biz-toggle svg{transform:rotate(180deg)}
.biz-prog{height:3px;background:var(--surface-2);margin:0 14px 8px;border-radius:2px;overflow:hidden}
.biz-prog i{display:block;height:100%;background:var(--c)}
.biz-list{padding:0 10px 10px 28px;display:flex;flex-direction:column;gap:2px}
.biz-item{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:6px;cursor:pointer}
.biz-item:hover{background:var(--surface-2)}
.biz-item time{font:500 11px var(--f-mono);color:var(--ink-3);flex:none}
.biz-item span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.biz-item small{color:var(--ink-3);font-size:11px;flex:none}

/* ---------- dialogs ---------- */
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:var(--shadow)}
dialog.wide{width:min(880px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(20,10,10,.45);backdrop-filter:blur(2px)}
.dlg-head{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 4px}
.dlg-head h2{font:800 22px/1.15 var(--f-display);letter-spacing:-.02em}
.dlg-head p{color:var(--ink-3);font-size:13px;margin-top:4px}
.dlg-close{margin-left:auto;border:0;background:none;color:var(--ink-3);padding:4px;border-radius:6px}
.dlg-body{padding:12px 20px 20px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2);min-width:0}
.field input:not([type=color]):not([type=range]),.field select,.field textarea{height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-size:14px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.field textarea{height:auto;min-height:84px;padding:8px 10px;resize:vertical}
.field small{color:var(--ink-3);font-weight:500}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.dlg-actions{display:flex;gap:8px;align-items:center;margin-top:4px}
.dlg-actions .spacer{flex:1}
.kind-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.kind-pick label{position:relative}
.kind-pick input{position:absolute;opacity:0}
.kind-pick span{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px 4px;font-weight:600;font-size:13px;color:var(--ink-2);cursor:pointer}
.kind-pick input:checked+span{border-color:var(--kc);color:var(--kc);background:color-mix(in srgb,var(--kc) 10%,transparent)}
.kind-pick input:focus-visible+span{outline:2px solid var(--accent)}
.rgb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rgb input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px}
.rgb label{display:flex;align-items:center;gap:4px;font:600 11px var(--f-mono);color:var(--ink-3)}
.rgb label input{width:62px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 6px;font:500 13px var(--f-mono);color:var(--ink)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{width:26px;height:26px;border-radius:7px;border:2px solid transparent;background:var(--sw)}
.swatches button.on{border-color:var(--ink)}
.preview-bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--c) 14%,var(--surface));font-size:13px;font-weight:600}
.preview-bar i{width:4px;height:18px;border-radius:2px;background:var(--c)}
.confirm-body{padding:20px;display:flex;flex-direction:column;gap:16px}
.confirm-body p{font-size:15px;font-weight:600}

.toast-wrap{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;font-size:13px;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

/* ---------- war room ---------- */
.sec-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font:800 clamp(24px,3vw,34px)/1.05 var(--f-display);letter-spacing:-.03em}
.sec-head p{color:var(--ink-2);margin-top:6px;max-width:60ch}
.sec-head .tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stage{position:relative;height:clamp(420px,62vh,640px);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 50% 55%,#3A1410 0%,var(--stage-bg) 62%);border:1px solid var(--stage-line);color:var(--stage-ink)}
.stage .grid-lines{position:absolute;inset:0;background-image:linear-gradient(rgba(255,120,90,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,120,90,.05) 1px,transparent 1px);background-size:44px 44px}
.ember{position:absolute;bottom:-10px;left:calc(var(--e) * 5.6%);width:4px;height:4px;border-radius:50%;background:#FF9B50;box-shadow:0 0 8px #FF7A2E;animation:rise calc(6s + var(--e) * .37s) linear infinite;animation-delay:calc(var(--e) * -.71s);opacity:.8}
@keyframes rise{to{transform:translate(calc((var(--e) - 9) * 3px),-700px);opacity:0}}
.hero-fist{position:absolute;left:50%;top:50%;width:clamp(150px,22vw,230px);transform:translate(-50%,-50%);filter:drop-shadow(0 0 40px rgba(255,90,30,.45));animation:breathe 3.6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:translate(-50%,-52%) scale(1.03)}}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0}
.flame-btn{position:absolute;left:0;top:0;border:0;background:none;color:var(--stage-ink);padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;width:140px;margin-left:-70px;margin-top:-50px;animation:orbit var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes orbit{from{transform:rotate(0deg) translateX(var(--rad)) rotate(0deg)}to{transform:rotate(360deg) translateX(var(--rad)) rotate(-360deg)}}
.stage:hover .flame-btn{animation-play-state:paused}
.flame{position:relative;width:calc(34px * var(--heat));height:calc(46px * var(--heat));filter:drop-shadow(0 0 var(--glow) var(--fc))}
.flame i,.flame b{position:absolute;left:50%;bottom:0;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;transform:translateX(-50%);animation:flick 1.3s ease-in-out infinite alternate}
.flame i{width:100%;height:100%;background:radial-gradient(circle at 50% 75%,#FFE7A8 0%,var(--fc) 55%,color-mix(in srgb,var(--fc) 40%,#300) 100%)}
.flame b{width:52%;height:58%;background:radial-gradient(circle at 50% 80%,#FFFFFF 0%,#FFE7A8 50%,transparent 75%);animation-duration:.9s}
@keyframes flick{to{transform:translateX(-50%) scaleY(1.08) scaleX(.94)}}
.flame-label{background:rgba(20,10,10,.72);border:1px solid var(--stage-line);border-radius:8px;padding:5px 9px;text-align:center;max-width:140px}
.flame-label small{display:block;font:600 9px var(--f-mono);letter-spacing:.1em;color:var(--stage-ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flame-label strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flame-label em{display:block;font:500 10.5px var(--f-mono);font-style:normal;color:#FFB36B}
.stage-count{position:absolute;left:16px;bottom:16px;display:flex;align-items:center;gap:10px;background:rgba(20,10,10,.7);border:1px solid var(--stage-line);border-radius:10px;padding:10px 14px}
.stage-count span{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--stage-ink-2);display:block}
.stage-count strong{display:block;font-size:14px}
.stage-empty{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:var(--stage-ink-2);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font:800 30px/1.1 var(--f-display);margin:4px 0 2px}
.stat small{color:var(--ink-3)}
@media (prefers-reduced-motion: reduce){.flame-btn,.ember,.hero-fist,.flame i,.flame b{animation:none!important}.ember{display:none}}

.yard{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.lot{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;border-radius:10px;text-align:center;min-width:0}
.lot:hover{background:var(--surface-2)}
.tower{width:96px;display:flex;flex-direction:column;gap:2px;justify-content:flex-end;height:250px}
.floor{height:17px;border-radius:2px;border:1px dashed var(--line-strong);display:flex;gap:3px;align-items:center;justify-content:center;padding:0 6px;position:relative}
.floor.built{border:0;background:var(--c)}
.floor.built i{width:9px;height:7px;background:rgba(255,240,200,.85);border-radius:1px}
.floor.framing{border:1px solid var(--c);background:repeating-linear-gradient(45deg,transparent 0 5px,color-mix(in srgb,var(--c) 30%,transparent) 5px 7px)}
.foundation{height:10px;background:var(--ink-2);border-radius:2px;width:118px}
.lot small{font:600 9.5px var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.lot strong{display:block;font-size:14px}
.lot .meta{font:500 11.5px var(--f-mono);color:var(--ink-2)}

.proj-detail{display:flex;flex-direction:column;gap:14px}
.proj-top{display:flex;gap:14px;align-items:center}
.proj-badge{width:64px;height:64px;border-radius:12px;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;font:800 18px var(--f-display)}
.proj-badge small{font:600 9px var(--f-mono);color:var(--ink-3)}
.dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dl div{background:var(--bg);border-radius:8px;padding:8px 10px}
.dl dt{font:600 10px var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.dl dd{margin:2px 0 0;font-weight:600}
.progress{display:flex;flex-direction:column;gap:6px}
.progress header{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2)}
.progress header b{font:600 13px var(--f-mono);color:var(--ink)}
.progress .track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress .track i{display:block;height:100%;background:var(--c);border-radius:4px}


/* ---------- war room orbit ---------- */
.orb{position:relative;height:clamp(460px,64vh,620px);border:1px solid var(--line);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 22% -10%,color-mix(in srgb,var(--c) 18%,transparent),transparent 55%),var(--surface);outline:none}
.orb:focus-visible{box-shadow:0 0 0 2px var(--accent)}
.orb-canvas{position:absolute;left:50%;top:50%;width:960px;height:520px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:50% 50%}
.orb-arc{position:absolute;left:0;top:0;width:960px;height:520px;overflow:visible;pointer-events:none}
.orb-pager{position:absolute;left:72px;top:140px;display:flex;flex-direction:column;align-items:center;gap:7px}
.orb-dot{width:16px;height:10px;display:grid;place-items:center;border:0;background:none;padding:0;transition:height .45s cubic-bezier(.3,.7,.2,1),width .45s cubic-bezier(.3,.7,.2,1)}
.orb-dot i{display:block;width:3px;height:3px;border-radius:3px;background:var(--ink);opacity:.4;transition:height .45s cubic-bezier(.3,.7,.2,1),width .45s cubic-bezier(.3,.7,.2,1),opacity .3s}
.orb-dot.on{height:26px}.orb-dot.on i{height:22px;opacity:1;background:var(--c)}
.orb-plates{position:absolute;left:120px;top:70px;width:250px;height:250px;touch-action:pan-y}
.orb-plate{position:absolute;inset:0;transform-origin:69% -217%;visibility:hidden}
.orb-plate.on,.orb-hd.on,.orb-body.on{visibility:visible}
.plate{position:relative;width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,#FFFFFF 0%,#F7F1EF 55%,#E6DAD6 100%);box-shadow:0 22px 30px -12px rgba(40,10,10,.4),0 4px 8px rgba(40,10,10,.12),inset 0 0 0 12px rgba(255,255,255,.7),inset 0 0 0 13px rgba(0,0,0,.05)}
.plate .ring{position:absolute;inset:22px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p) * 1%),color-mix(in srgb,var(--c) 16%,#F1E7E4) 0);-webkit-mask:radial-gradient(circle,transparent 63%,#000 64%);mask:radial-gradient(circle,transparent 63%,#000 64%)}
.plate img{position:relative;width:52%;height:auto;max-width:none;filter:drop-shadow(0 6px 10px rgba(120,30,0,.35));user-select:none;-webkit-user-drag:none;pointer-events:none}
.plate b{position:absolute;bottom:20%;font:800 18px/1 var(--f-display);color:#2B1F21;background:rgba(255,255,255,.92);padding:4px 10px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.orb-head{position:absolute;left:400px;top:86px;width:320px;height:170px}
.orb-hd{position:absolute;inset:0;visibility:hidden}
.orb-eye{font:600 12px var(--f-mono);letter-spacing:.06em;color:var(--ink-2);margin:0 0 4px 2px}
.orb-hd h2{margin:0;font:inherit}
.orb-t1,.orb-t2{display:block;white-space:nowrap;line-height:1.08}
.orb-t1{font-family:var(--f-display);font-weight:200;letter-spacing:-.01em;text-transform:uppercase;color:var(--ink);margin-top:6px}
.orb-t2{font-family:var(--f-body);font-weight:700;letter-spacing:-.03em;color:var(--ink);margin-top:4px}
.orb-acts{position:absolute;left:404px;top:282px;display:flex;gap:28px}
.orb-act{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;font-weight:600;font-size:13px;color:var(--ink)}
.orb-act svg{color:var(--c)}
.orb-card{position:absolute;left:728px;top:106px;width:216px;padding:16px 18px 18px;border-radius:18px;background:color-mix(in srgb,var(--surface) 80%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 18px 40px -24px rgba(0,0,0,.3)}
.orb-tabs{display:flex;gap:14px;font-size:12px;margin-bottom:14px}
.orb-tabs button{border:0;background:none;padding:2px 0;color:var(--ink-3);font-weight:500}
.orb-tabs button[aria-selected=true]{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--c)}
.orb-bodies{display:grid}
.orb-body{grid-area:1/1;visibility:hidden;min-width:0}
.orb-rate{position:relative;height:58px;margin:0 0 10px}
.orb-badge{position:absolute;left:0;top:0;width:44px;height:58px;border-radius:10px;opacity:.85}
.orb-num{position:absolute;left:8px;top:6px;font:800 34px/1 var(--f-display);letter-spacing:-.04em;color:var(--ink)}
.orb-num small{font-size:14px;font-weight:600}
.orb-floor{position:absolute;left:0;bottom:-2px;font:500 10.5px var(--f-mono);color:var(--ink-3);padding-left:52px}
.orb-owner{font-weight:700;font-size:16px}
.orb-meta{font:500 10.5px var(--f-mono);color:var(--ink-3);margin:2px 0 10px}
.orb-desc{font-size:12.5px;line-height:1.45;min-height:54px;color:var(--ink-2);overflow-wrap:anywhere}
.orb-sched{list-style:none;margin:0;padding:0;min-height:54px;display:flex;flex-direction:column;gap:4px;font-size:12px}
.orb-sched li{display:flex;gap:6px;min-width:0}
.orb-sched li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orb-sched time{font:500 11px var(--f-mono);color:var(--ink-3);flex:none}
.orb-sched li.none{color:var(--ink-3)}
.orb-card[data-tab=overview] .sc,.orb-card[data-tab=sched] .ov{display:none}
.orb-react{display:flex;gap:6px;margin-top:14px}
.orb-strip{position:absolute;left:120px;top:356px;width:560px;height:126px;display:flex;align-items:center}
.orb-arrow{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--ink);flex:none;border-radius:8px}
.orb-arrow svg{width:12px;height:16px;fill:currentColor}
.orb-win{position:relative;width:472px;height:126px;overflow:hidden;flex:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.orb-track{position:absolute;left:0;top:0;display:flex;transition:transform .6s cubic-bezier(.65,0,.35,1)}
.orb-th{width:118px;height:126px;display:flex;justify-content:center;padding-top:3px}
.orb-th button{width:86px;height:118px;border:0;background:none;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:10px;transition:background .45s,box-shadow .45s;color:var(--ink)}
.orb-th button.on{background:var(--bg);box-shadow:0 10px 24px -16px rgba(0,0,0,.35),inset 0 0 0 1px var(--line)}
.orb-th .mini{width:54px;height:54px;border-radius:50%;flex:none;background:radial-gradient(circle,#FFFFFF 0 46%,transparent 47%),conic-gradient(var(--c) calc(var(--p) * 1%),color-mix(in srgb,var(--c) 18%,#EEE5E2) 0);box-shadow:0 4px 8px rgba(0,0,0,.15);transition:transform .45s}
.orb-th button.on .mini{transform:scale(1.07)}
.orb-th .lb{font-size:10.5px;font-weight:600;line-height:1.25;text-align:center;max-width:84px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;color:var(--ink-2)}
.orb-empty{display:grid;place-items:center;height:auto;padding:30px 0}
.orb-empty img{width:110px;height:auto}
@media (prefers-reduced-motion:reduce){.orb-track,.orb-dot,.orb-dot i,.orb-th button,.orb-th .mini{transition:none}}
@media (max-width:700px){
  .orb{height:auto}
  .orb-canvas{position:relative;left:auto;top:auto;width:100%;height:auto;transform:none;display:flex;flex-direction:column;align-items:center;padding:16px 16px 18px}
  .orb-arc{width:200%;height:auto;left:-60%;top:-40px}
  .orb-pager{position:relative;left:auto;top:auto;flex-direction:row;margin-bottom:14px}
  .orb-dot{width:12px;height:12px}.orb-dot.on{width:28px;height:12px}.orb-dot.on i{height:3px;width:22px}
  .orb-plates{position:relative;left:auto;top:auto;width:min(56vw,220px);height:min(56vw,220px)}
  .orb-head{position:relative;left:auto;top:auto;width:100%;height:128px;margin-top:12px}
  .orb-hd{text-align:center;transform:scale(.8);transform-origin:50% 0}
  .orb-acts{position:relative;left:auto;top:auto}
  .orb-card{position:relative;left:auto;top:auto;width:100%;margin-top:12px}
  .orb-strip{display:none}
}
/* ---------- project summary ---------- */
.summary{margin-top:14px}
.sum-wrap{overflow-x:auto}
.sum{width:100%;border-collapse:collapse;font-size:13px;min-width:880px}
.sum th{text-align:left;font:600 10.5px var(--f-mono);letter-spacing:.08em;color:var(--ink-3);padding:8px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.sum td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.sum tbody tr:last-child td{border-bottom:0}
.sum tbody tr{cursor:pointer}
.sum tbody tr:hover{background:var(--surface-2)}
.sum tbody tr.cur{background:color-mix(in srgb,var(--c) 8%,transparent)}
.sum .n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum-name{display:flex;align-items:center;gap:9px}
.sum-name i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.sum-name small{display:block;font:600 9.5px var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.sum-name strong{font-weight:600}
.sum-prog{display:flex;align-items:center;gap:8px;min-width:130px}
.sum-prog .track{flex:1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.sum-prog .track i{display:block;height:100%;background:var(--c)}
.sum-prog b{font:600 12px var(--f-mono);width:40px;text-align:right}
.sum-next{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ---------- team ---------- */
.me-chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 4px;border:1px solid var(--line);background:var(--surface);border-radius:99px;font-weight:600;font-size:13px;color:var(--ink);max-width:180px}
.me-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-chip.empty{padding:0 12px;color:var(--accent);border-color:var(--accent-line)}
.ava{display:inline-grid;place-items:center;border-radius:50%;background:var(--ac);color:#FFFFFF;font-weight:700;flex:none;font-size:14px;line-height:1}
.team-layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
.mem-list{list-style:none;margin:0;padding:6px;display:flex;flex-direction:column;gap:2px}
.mem-list li{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;flex-wrap:wrap}
.mem-list li.me{background:var(--accent-soft)}
.mem-list li>div{min-width:0;flex:1}
.mem-list strong{display:block;font-weight:600;overflow-wrap:anywhere}
.mem-list em{font:600 10px var(--f-mono);font-style:normal;color:var(--accent);margin-left:4px}
.mem-list li>div span{font-size:12px;color:var(--ink-3)}
.mem-list li.none{color:var(--ink-3);font-size:13px;justify-content:center;padding:16px}
.reg-cta{margin:0 10px 10px;padding:14px;border:1px dashed var(--accent-line);border-radius:10px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.reg-cta span{font-size:12.5px;color:var(--ink-2)}
.team-note{padding:4px 14px 14px;font-size:12px;color:var(--ink-3)}
.memo-tabs{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.memo-list{display:flex;flex-direction:column;gap:8px}
.memo{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.memo.unread{border-color:var(--accent-line);box-shadow:inset 3px 0 0 var(--accent)}
.memo-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.memo header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.memo header .to{color:var(--ink-2)}
.memo header .new{font:600 9.5px var(--f-mono);letter-spacing:.08em;color:var(--accent-ink);background:var(--accent);padding:1px 6px;border-radius:4px}
.memo header time{margin-left:auto;font:500 11.5px var(--f-mono);color:var(--ink-3)}
.memo p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.55}
.memo footer{display:flex;gap:6px;flex-wrap:wrap}
.chip-mini{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink)}
.chip-mini i{width:7px;height:7px;border-radius:2px;background:var(--c)}
@media (max-width:1180px){.team-layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){.me-chip .nm{display:none}.me-chip{padding:0 4px}.me-chip.empty{padding:0 10px}}


/* ---------- sign in ---------- */
.locked .app,.locked .tabbar{display:none}
.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(circle at 20% 0%,var(--accent-soft),transparent 55%),var(--bg)}
.auth-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 24px 22px;display:flex;flex-direction:column;gap:14px}
.auth-card h1{font:800 24px/1.15 var(--f-display);letter-spacing:-.02em}
.auth-card p.lead{color:var(--ink-2);font-size:13.5px;margin-top:-6px}
.auth-card form{display:flex;flex-direction:column;gap:11px}
.auth-card .seg{align-self:flex-start}
.auth-err{min-height:18px;color:var(--danger);font-size:13px;font-weight:600}
.auth-card .btn.primary{height:42px;font-size:15px}
.logout{border:0;background:none;color:var(--ink-3);font-size:12px;text-align:left;padding:0;text-decoration:underline;text-underline-offset:3px}

/* ---------- mindmap ---------- */
.mm-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.mm-head .tools{margin-left:auto;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.mm-head select{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-weight:600;max-width:220px}
.save-state{font:500 12px var(--f-mono)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.tg{display:flex;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.tg>span{font:600 9.5px var(--f-mono);letter-spacing:.1em;color:var(--ink-3);padding:0 6px}
.tg button{border:0;background:none;height:28px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.tg button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.tg button.on{background:var(--ink);color:var(--bg)}
.tg button:disabled{opacity:.35;cursor:not-allowed}
.tg input[type=color]{width:30px;height:26px;border:0;background:none;padding:0}
.tg code{font:500 11px var(--f-mono);color:var(--ink-3);padding-right:6px}
.mm-wrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:stretch}
.mm-canvas{position:relative;height:clamp(440px,68vh,780px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.mm-canvas.panning{cursor:grabbing}
.mm-dots{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;opacity:.55}
.mm-world{position:absolute;left:0;top:0;transform-origin:0 0}
.mm-edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:1}
.mm-edges path.hit{fill:none;stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
.mm-node{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;cursor:grab}
.mm-node svg.shape{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.mm-node img{position:relative;width:100%;flex:1;min-height:0;object-fit:cover;border-radius:6px;pointer-events:none}
.mm-node .lbl{position:relative;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3;pointer-events:none;max-width:100%}
.mm-node.has-img .lbl{flex:none;margin-top:4px}
.mm-node.sel svg.shape{filter:drop-shadow(0 0 0 transparent)}
.mm-node.sel::after{content:"";position:absolute;inset:-5px;border:1.5px dashed var(--accent);border-radius:6px;pointer-events:none}
.mm-h{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--hc);opacity:0;z-index:3;cursor:crosshair}
.mm-node:hover .mm-h,.mm-node.sel .mm-h{opacity:1}
.mm-h.top{left:50%;top:-6px;margin-left:-6px}.mm-h.bottom{left:50%;bottom:-6px;margin-left:-6px}.mm-h.left{top:50%;left:-6px;margin-top:-6px}.mm-h.right{top:50%;right:-6px;margin-top:-6px}
.mm-r{position:absolute;width:10px;height:10px;background:var(--accent);border:2px solid var(--surface);z-index:4}
.mm-r.nw{left:-9px;top:-9px;cursor:nwse-resize}.mm-r.ne{right:-9px;top:-9px;cursor:nesw-resize}.mm-r.sw{left:-9px;bottom:-9px;cursor:nesw-resize}.mm-r.se{right:-9px;bottom:-9px;cursor:nwse-resize}
.mm-marquee{position:absolute;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);pointer-events:none;z-index:50}
.mm-zoom{position:absolute;left:10px;bottom:10px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;z-index:20}
.mm-zoom button{border:0;background:none;width:30px;height:28px;display:grid;place-items:center;color:var(--ink-2);border-bottom:1px solid var(--line)}
.mm-zoom button:last-child{border-bottom:0}
.mm-zoom span{font:500 10px var(--f-mono);text-align:center;color:var(--ink-3);padding:3px 0;border-bottom:1px solid var(--line)}
.mm-mini{position:absolute;right:10px;bottom:10px;width:170px;height:112px;background:var(--surface);border:1px solid var(--line);border-radius:8px;z-index:20;cursor:pointer}
.inspector{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:14px;overflow:auto;height:clamp(440px,68vh,780px)}
.inspector h3{font-size:15px;font-weight:700;margin-top:3px}
.isec{display:flex;flex-direction:column;gap:7px}
.isec>span{font:600 10px var(--f-mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.inspector textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px;resize:vertical}
.inspector small{color:var(--ink-3);font-size:11.5px}
.ibtns{display:flex;flex-wrap:wrap;gap:4px}
.ibtns button{border:1px solid var(--line);background:var(--bg);border-radius:7px;height:30px;padding:0 9px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.ibtns button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ibtns.g2{display:grid;grid-template-columns:1fr 1fr}
.fs-row{display:flex;align-items:center;gap:6px}
.fs-row input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.fs-row b{font:600 12px var(--f-mono);width:38px;text-align:right}
.wh{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.wh label{display:flex;align-items:center;gap:5px;font:600 11px var(--f-mono);color:var(--ink-3)}
.wh input{width:100%;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--bg);padding:0 6px;font:500 13px var(--f-mono)}
.inspector .rgb input[type=color]{width:36px;height:32px}
.inspector .rgb label input{width:50px;height:30px}
.remove{border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);color:var(--danger);background:none;border-radius:8px;height:34px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.insp-empty{color:var(--ink-3);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;padding:30px 6px}
.shortcuts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.shortcuts h4{font-size:13px;margin-bottom:6px}
.shortcuts p{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center;padding:3px 0}
kbd{font:600 11px var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.hidden-file{display:none}

/* ---------- notes ---------- */
.notes-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:10px}
.notes-bar select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 10px;font-weight:600;max-width:240px}
.notes-bar .count{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13px}
.notes-bar .count i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.folders{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fchip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;overflow:hidden}
.fchip button{border:0;background:none;height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;color:var(--ink-2)}
.fchip button b{font:600 11px var(--f-mono);color:var(--ink-3)}
.fchip .fedit{border-left:1px solid var(--line);padding:0 8px;color:var(--ink-3)}
.fchip svg{color:var(--fc,var(--ink-3))}
.fchip.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.fchip.active button{color:var(--ink)}
.fchip.add{border-style:dashed}
.notes-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.note{background:var(--nc);border:1px solid color-mix(in srgb,var(--nc) 70%,var(--line-strong));border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;min-height:220px;color:#2B1F21;min-width:0}
.note-top{display:flex;align-items:center;gap:6px}
.note-top>span{font:600 10px var(--f-mono);letter-spacing:.1em;color:#7A6A6C}
.note-top .ftag{margin-left:auto;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;background:rgba(255,255,255,.6);border-radius:5px;padding:1px 6px;color:#4A3B3D}
.note-top .ftag svg{color:var(--fc)}
.note-top .del{border:0;background:none;color:#7A6A6C;padding:2px;border-radius:5px}
.note-top .del:hover{color:#C7362B}
.note-top .ftag+.del{margin-left:0}
.note-top>span+.del{margin-left:auto}
.note h3{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.note-body{flex:1;font-size:13.5px;line-height:1.55;overflow:hidden;max-height:190px;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(#000 75%,transparent)}
.note footer{display:flex;align-items:center;justify-content:space-between;font:500 11px var(--f-mono);color:#7A6A6C}
.note footer button{border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.65);border-radius:7px;height:28px;padding:0 9px;font:600 12px var(--f-body);color:#2B1F21;display:inline-flex;align-items:center;gap:5px}
.editor-meta{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) minmax(0,1.2fr);gap:10px;align-items:end}
.title-input{height:44px!important;font-size:18px!important;font-weight:700!important}
.rte{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.rte-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:7px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rte-tools select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 6px;font-size:12.5px}
.rte-tools button{height:30px;min-width:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);display:inline-grid;place-items:center;padding:0 8px;font-size:12.5px;font-weight:600}
.rte-tools label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);font-weight:600}
.rte-tools input[type=color]{width:30px;height:28px;border:0;padding:0;background:none}
.rte-canvas{min-height:300px;max-height:52vh;overflow:auto;padding:16px;outline:none;font-size:16px;line-height:1.6;background:var(--ncanvas,#FFFFFF);color:#2B1F21}
.rte-canvas:empty::before{content:attr(data-placeholder);color:#9A8C8E}
.rte-foot{display:flex;justify-content:space-between;padding:6px 10px;font-size:11.5px;color:var(--ink-3);border-top:1px solid var(--line)}
.rte-foot b{font:500 11.5px var(--f-mono)}
.note-swatches{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.note-swatches button{width:22px;height:22px;border-radius:6px;border:1px solid var(--line-strong);background:var(--sw)}
.note-swatches button.on{outline:2px solid var(--ink);outline-offset:1px}
.note-swatches input[type=color]{width:28px;height:26px;border:0;padding:0;background:none}

.loading-note{display:flex;align-items:center;gap:8px;color:var(--ink-3);font-size:13px;padding:6px 0 14px}
.spin{width:14px;height:14px;border:2px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .cal-layout{grid-template-columns:minmax(0,1fr)}
  .side{position:static;display:grid;grid-template-columns:1fr 1fr}
  .mm-wrap{grid-template-columns:minmax(0,1fr)}
  .inspector{height:auto;max-height:none}
  .notes-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .mobile-brand{display:flex}
  .topbar .page-title{display:none}
  .search label{width:min(200px,38vw)}
  .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px}
  .tabbar button.active{color:var(--accent)}
  .side{grid-template-columns:minmax(0,1fr)}
  .day{min-height:76px;padding:4px 3px}
  .pill{padding:1px 3px;font-size:10.5px}
  .pill time{display:none}
  .week{grid-template-columns:minmax(0,1fr)}
  .wcol{border-right:0;border-bottom:1px solid var(--line);min-height:0}
  .wcol header{display:flex;align-items:baseline;gap:8px}
  .stats{grid-template-columns:minmax(0,1fr)}
  .notes-grid{grid-template-columns:minmax(0,1fr)}
  .editor-meta{grid-template-columns:minmax(0,1fr)}
  .row3{grid-template-columns:1fr 1fr}
  .shortcuts{grid-template-columns:minmax(0,1fr)}
  .mm-mini{display:none}
  .agenda-day{grid-template-columns:64px minmax(0,1fr)}
  .agenda-date{padding:10px}
  .agenda-date strong{font-size:20px}
}
@media (max-width:480px){
  .search label{width:40px;padding:0;justify-content:center}
  .search label input{position:absolute;opacity:0;pointer-events:none;width:0}
  .search.open label{width:min(220px,58vw);padding:0 10px;justify-content:flex-start}
  .search.open label input{position:static;opacity:1;pointer-events:auto;width:auto}
  .day{min-height:62px}
  .pill span{display:none}
  .pill{height:6px;padding:0;border-radius:3px;background:var(--c)}
  .pill::before{display:none}
  .more{font-size:10px;padding-left:2px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .kind-pick{grid-template-columns:repeat(2,1fr)}
  .cal-tools{margin-left:0}
}
</style>

</section>

  <aside class="rail" aria-label="주요 메뉴">
    <div class="brand">
      <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h3v3H8z" fill="currentColor"/></svg></div>

/* Server store with the same surface the page already uses: collection().onSnapshot / doc().set|delete|get. Changes arrive by polling /api/sync */
function serverDB(){
  const store={},listeners={};let cursor=0,first=true,busy=false,timer=0;
  const snap=c=>{const m=store[c]||new Map();const docs=[...m].map(([id,v])=>({id,exists:true,data:()=>v}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]}};
  const emit=c=>(listeners[c]||[]).forEach(f=>f(snap(c)));
  async function poll(){if(busy)return;busy=true;clearTimeout(timer);
    try{const changed=new Set();let more=true;
      while(more){const d=await api(`/api/sync?since=${cursor}`);
        for(const x of d.docs){const m=store[x.collection]||(store[x.collection]=new Map());if(x.deleted)m.delete(x.id);else m.set(x.id,x.data);changed.add(x.collection)}
        const mem=new Map((d.members||[]).map(u=>[u.id,u]));if(JSON.stringify([...mem])!==JSON.stringify([...(store.members||new Map())])){store.members=mem;changed.add("members")}
        cursor=d.cursor;more=d.more}
      if(first){first=false;COLS.forEach(c=>changed.add(c))}
      changed.forEach(emit);setSync("live","실시간 공유 중",`팀원 ${(store.members||new Map()).size}명 · 4초마다 동기화`)}
    catch(e){if(e.status!==401)setSync("local","연결 끊김","잠시 후 다시 연결합니다")}
    finally{busy=false;timer=setTimeout(poll,document.hidden?20000:4000)}}
  const url=(c,id)=>`/api/docs/${c}/${encodeURIComponent(id)}`;
  const ref=(c,id)=>({id,
    async set(data){await api(url(c,id),{method:"PUT",body:JSON.stringify(data)});(store[c]||(store[c]=new Map())).set(id,data);setTimeout(poll,150)},
    async delete(){await api(url(c,id),{method:"DELETE"});if(store[c])store[c].delete(id);setTimeout(poll,150)},
    async get(){if(store[c]&&store[c].has(id)){const v=store[c].get(id);return {id,exists:true,data:()=>v}}
      try{const d=await api(url(c,id));return {id,exists:true,data:()=>d.data}}catch(e){if(e.status===404)return {id,exists:false,data:()=>undefined};throw e}}});
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()});
  window.addEventListener("focus",()=>poll());
  return {poll,doc:path=>{const i=path.indexOf("/");return ref(path.slice(0,i),path.slice(i+1))},
    collection:c=>({doc:id=>ref(c,id),onSnapshot(next){(listeners[c]||(listeners[c]=[])).push(next);if(!first)next(snap(c));return ()=>{}}})};
}

/* ============ projects (war room) ============ */
const ORB_ITEM=118,ORB_VIS=4,ORB_SWING=50;
const ARC_REST=[[50,98],[46,124],[60,126],[40,100]],ARC_SWEEP=[38,146];
const arcRest=i=>ARC_REST[((i%ARC_REST.length)+ARC_REST.length)%ARC_REST.length];
function arcPath(a0,a1,cx,cy,r,w,steps=48){const o=[],n=[];for(let i=0;i<=steps;i++){const t=i/steps,ang=((a0+(a1-a0)*t)*Math.PI)/180,h=(w/2)*Math.pow(Math.sin(Math.PI*t),.45),c=Math.cos(ang),sn=Math.sin(ang);o.push((cx+c*(r+h)).toFixed(1)+" "+(cy+sn*(r+h)).toFixed(1));n.push((cx+c*(r-h)).toFixed(1)+" "+(cy+sn*(r-h)).toFixed(1))}return "M"+o.join("L")+"L"+n.reverse().join("L")+"Z"}
const stripStart=(i,n)=>n<=ORB_VIS?0:Math.max(0,Math.min(i-1,n-ORB_VIS));
const fitSize=(chars,max,width,em)=>Math.min(max,width/(Math.max(1,chars)*em));
/* War room carousel: every project is in the DOM; GSAP swings only the outgoing and incoming plate on a wide orbit */
const WR={idx:0,tab:"overview",arc:{a0:50,a1:98},tl:null,ro:null,swipe:null,
  drawArc(){const el=$("#orb-arc");if(el)el.setAttribute("d",arcPath(this.arc.a0,this.arc.a1,299,-450,650,118))},
  mount(){if(this.ro){this.ro.disconnect();this.ro=null}if(this.tl){this.tl.kill();this.tl=null}
    const root=$("#orb");if(!root)return;const rest=arcRest(this.idx);this.arc={a0:rest[0],a1:rest[1]};this.drawArc();
    const fit=()=>{root.style.setProperty("--s",String(Math.min(root.clientWidth/960,root.clientHeight/520,1.5)))};fit();
    if(window.ResizeObserver){this.ro=new ResizeObserver(fit);this.ro.observe(root)}
    root.addEventListener("keydown",e=>{if(e.target!==root)return;if(e.key==="ArrowRight"){e.preventDefault();this.go(this.idx+1,1)}else if(e.key==="ArrowLeft"){e.preventDefault();this.go(this.idx-1,-1)}});
    const pl=$("#orb-plates");if(pl){pl.addEventListener("pointerdown",e=>{this.swipe={x:e.clientX,y:e.clientY}});pl.addEventListener("pointercancel",()=>{this.swipe=null});
      pl.addEventListener("pointerup",e=>{const sw=this.swipe;this.swipe=null;if(!sw)return;const dx=e.clientX-sw.x;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(e.clientY-sw.y)*1.4)this.go(this.idx+(dx<0?1:-1),dx<0?1:-1);else if(Math.abs(dx)<6){const p=projects()[this.idx];if(p)openProjectDetail(p)}})}},
  go(to,dir){const P=projects(),n=P.length;if(n<2)return;to=((to%n)+n)%n;const from=this.idx;if(to===from)return;
    if(!dir){const f=(to-from+n)%n;dir=f<=n-f?1:-1}
    const root=$("#orb");this.idx=to;if(!root)return;
    if(this.tl){this.tl.progress(1).kill();this.tl=null}
    $$("[data-orb-go]",root).forEach(b=>{const on=+b.dataset.orbGo===to;b.classList.toggle("on",on);if(b.classList.contains("orb-dot"))b.setAttribute("aria-selected",String(on))});
    $$(".sum tbody tr").forEach(r=>r.classList.toggle("cur",+r.dataset.orbGo===to));
    const tr=$("#orb-track");if(tr)tr.style.transform=`translateX(${-stripStart(to,n)*ORB_ITEM}px)`;
    root.style.setProperty("--c",P[to].color);$("#orb-live").textContent=`${n}개 중 ${to+1}번째 사업: ${P[to].name}, 진행률 ${P[to].progress}%`;
    const part=i=>({plate:$(`[data-plate="${i}"]`,root),head:$(`[data-head="${i}"]`,root),body:$(`[data-body="${i}"]`,root)});
    const A=part(from),B=part(to);$$("button",A.body).forEach(b=>b.tabIndex=-1);$$("button",B.body).forEach(b=>b.tabIndex=0);
    const rest=arcRest(to),tint=P[to].color,arcEl=$("#orb-arc"),g=window.gsap;

  if(!plist.some(p=>p.id===S.notesProject)){S.notesProject=plist[0].id;S.folderFilter="all"}
  const p=plist.find(x=>x.id===S.notesProject);const notes=S.notes.filter(n=>n.projectId===p.id).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  const folders=S.folders.filter(f=>f.projectId===p.id).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));const fmap=new Map(folders.map(f=>[f.id,f]));
  if(S.folderFilter!=="all"&&S.folderFilter!=="unfiled"&&!fmap.has(S.folderFilter))S.folderFilter="all";

    <div class="notes-bar" style="--c:${p.color}">${icon("note",18)}<div><span class="eyebrow">현재 사업</span><div style="font-weight:700">${esc(p.name)}</div></div><select id="notes-project" aria-label="메모를 볼 사업 선택">${plist.map(x=>`<option value="${esc(x.id)}" ${x.id===p.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select><span class="count"><i></i><b class="mono">${notes.length}</b>개의 메모</span></div>
    <div class="folders" aria-label="메모 폴더"><span class="fchip ${S.folderFilter==="all"?"active":""}"><button data-folder="all">${icon("folder",15)}전체 <b>${notes.length}</b></button></span><span class="fchip ${S.folderFilter==="unfiled"?"active":""}"><button data-folder="unfiled">${icon("folder",15)}미분류 <b>${notes.filter(n=>!fmap.has(n.folderId)).length}</b></button></span>
      ${folders.map(f=>`<span class="fchip ${S.folderFilter===f.id?"active":""}" style="--fc:${col(f.color,"#E73535")}"><button data-folder="${esc(f.id)}">${icon("folder",15)}${esc(f.name)} <b>${notes.filter(n=>n.folderId===f.id).length}</b></button><button class="fedit" data-edit-folder="${esc(f.id)}" aria-label="${esc(f.name)} 폴더 수정">${icon("pen",12)}</button></span>`).join("")}
      <span class="fchip add"><button data-new-folder>${icon("folderPlus",15)}새 폴더</button></span></div>
    ${!notes.length?`<div class="panel"><div class="empty-block">${icon("note",26)}<strong>아직 작성된 메모가 없습니다</strong><span>큰 편집기에서 첫 기록을 남겨보세요.</span><button class="btn primary sm" data-new-note>${icon("plus",14)} 첫 메모 만들기</button></div></div>`
      :!vis.length?`<div class="panel"><div class="empty-block"><strong>이 폴더에는 메모가 없습니다</strong><span>새 메모를 만들면 현재 폴더에 바로 저장됩니다.</span><button class="btn primary sm" data-new-note>${icon("plus",14)} 메모 추가</button></div></div>`
      :`<section class="notes-grid">${vis.map((n,i)=>{const f=fmap.get(n.folderId);const txt=plainText(n.content);return `<article class="note" style="--nc:${col(n.cardColor,"#FFF7F2")}"><div class="note-top"><span>NOTE ${pad(i+1)}</span>${f?`<em class="ftag" style="--fc:${col(f.color,"#E73535")}">${icon("folder",11)}${esc(f.name)}</em>`:""}<button class="del" data-del-note="${esc(n.id)}" aria-label="${esc(n.title)} 삭제">${icon("trash",14)}</button></div><h3>${esc(n.title)}</h3><div class="note-body">${sanitizeRich(n.content)}</div><footer><span>${txt.length.toLocaleString("ko-KR")}자 · ${n.updatedAt?new Date(n.updatedAt).toLocaleDateString("ko-KR"):""}</span><button data-open-note="${esc(n.id)}">${icon("expand",13)} 확대해서 편집</button></footer></article>`}).join("")}</section>`}`;
}

      <div class="rte"><div class="rte-tools" id="rte-tools"><select data-cmd="fontName" aria-label="선택 영역 폰트"><option value="IBM Plex Sans KR">기본 고딕</option><option value="Georgia">명조</option><option value="Consolas">고정폭</option></select>
        <select data-cmd="size" aria-label="선택 영역 글씨 크기">${[12,14,16,18,20,24,28,32,36].map(s=>`<option value="${s}" ${s===16?"selected":""}>${s}px</option>`).join("")}</select>
        <button type="button" data-cmd="bold" aria-label="굵게"><b>B</b></button><button type="button" data-cmd="italic" aria-label="기울임"><i>I</i></button><button type="button" data-cmd="underline" aria-label="밑줄"><u>U</u></button>
        <label><input type="color" data-cmd="foreColor" value="#2b1f21" aria-label="글자색">글자색</label><button type="button" data-cmd="removeFormat">서식 지우기</button></div>
      <div class="rte-canvas" id="rte" contenteditable="true" data-placeholder="내용을 자유롭게 작성하세요…" style="--ncanvas:${card}"></div>
      <div class="rte-foot"><span>텍스트를 드래그한 뒤 크기·색상·서식을 적용하세요.</span><b id="rte-count">0 / 20,000자</b></div></div>
      <div class="dlg-actions"><span class="spacer"></span><button type="button" class="btn" data-close>취소</button><button class="btn primary" type="submit">${icon("save",14)} 저장하고 카드로 보기</button></div>`,
    onMount(f){const ed=$("#rte",f);ed.innerHTML=sanitizeRich(n.content);let range=null;
      const count=()=>$("#rte-count",f).textContent=`${plainText(ed.innerHTML).length.toLocaleString("ko-KR")} / 20,000자`;count();
      const remember=()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.getRangeAt(0).commonAncestorContainer))range=s.getRangeAt(0).cloneRange()};
      const restore=()=>{ed.focus();if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}};
      ["mouseup","keyup","input"].forEach(ev=>ed.addEventListener(ev,()=>{remember();if(ev==="input")count()}));
      const tools=$("#rte-tools",f);tools.addEventListener("mousedown",e=>{if(e.target.closest("button"))e.preventDefault()});
      const run=(cmd,val)=>{restore();try{document.execCommand("styleWithCSS",false,false)}catch(e){}
        if(cmd==="size"){document.execCommand("fontSize",false,"7");$$('font[size="7"]',ed).forEach(fn=>{const sp=document.createElement("span");sp.style.fontSize=val+"px";sp.innerHTML=fn.innerHTML;fn.replaceWith(sp)})}
        else document.execCommand(cmd,false,val);remember();count()};
      tools.addEventListener("click",e=>{const b=e.target.closest("button[data-cmd]");if(b)run(b.dataset.cmd)});
      tools.addEventListener("change",e=>{const s=e.target.closest("select[data-cmd]");if(s)run(s.dataset.cmd,s.value)});
      $("[data-cmd=foreColor]",tools).addEventListener("input",e=>run("foreColor",e.target.value));
      const setCard=c=>{card=c;ed.style.setProperty("--ncanvas",c);$("#ne-card",f).value=c.toLowerCase();$$("[data-nc]",f).forEach(b=>b.classList.toggle("on",b.dataset.nc===c))};
      $("#ne-card",f).addEventListener("input",e=>setCard(e.target.value.toUpperCase()));$$("[data-nc]",f).forEach(b=>b.addEventListener("click",()=>setCard(b.dataset.nc)));
      if(isNew)setTimeout(()=>{$("#ne-title",f).focus();$("#ne-title",f).select()},30)},
    onSubmit(f){const title=$("#ne-title",f).value.trim();if(!title){toast("메모 제목을 입력해주세요.");return false}const html=sanitizeRich($("#rte",f).innerHTML);
      if(plainText(html).length>20000){toast("메모는 20,000자까지 저장할 수 있습니다.");return false}
      put("notes",{...n,title,content:html,folderId:$("#ne-folder",f).value,cardColor:card,createdAt:n.createdAt||Date.now(),updatedAt:Date.now()});toast("메모를 저장했습니다")}});
}

/* ============ search & bell ============ */
function renderSearch(){
  const q=S.search.trim().toLowerCase();const box=$("#search-results");if(!q){box.hidden=true;return}
  const pm=projMap();const res=[];
  S.items.forEach(it=>{if(!isISO(it.eventDate)||(it.projectId&&!pm.has(it.projectId)))return;if((it.title+" "+(it.description||"")).toLowerCase().includes(q))res.push({t:"item",id:it.id,tag:KIND[it.kind]?.label||"일정",title:it.title,sub:fmtLong(it.eventDate)+(pm.get(it.projectId)?" · "+pm.get(it.projectId).name:"")})});
  projects().forEach(p=>{if((p.name+" "+p.category+" "+p.nextAction).toLowerCase().includes(q))res.push({t:"project",id:p.id,tag:"사업",title:p.name,sub:p.category+" · "+p.progress+"%"})});
  S.notes.forEach(n=>{const p=pm.get(n.projectId);if(!p)return;if((n.title+" "+plainText(n.content)).toLowerCase().includes(q))res.push({t:"note",id:n.id,tag:"메모",title:n.title,sub:p.name})});
  box.innerHTML=res.length?res.slice(0,14).map(r=>`<button data-res="${r.t}" data-id="${esc(r.id)}"><span class="res-tag">${esc(r.tag)}</span><span class="res-main"><strong>${esc(r.title)}</strong><span>${esc(r.sub)}</span></span></button>`).join(""):`<div class="empty">‘${esc(S.search)}’와 일치하는 항목이 없습니다.</div>`;box.hidden=false;
}
function upcoming(){const t=todayISO(),e=new Date(parseISO(t));e.setDate(e.getDate()+7);const end=iso(e);const pm=projMap();return S.items.filter(it=>isISO(it.eventDate)&&it.eventDate>=t&&it.eventDate<=end&&(!it.projectId||pm.has(it.projectId))&&!/완료/.test(it.status||"")).sort(byTime)}
function renderBell(){const up=upcoming(),pm=projMap(),un=unreadMemos();$("#bell-panel").innerHTML=(un.length?`<div class="eyebrow" style="padding:8px">새 메모 ${un.length}</div>`+un.slice(0,5).map(m=>{const f=S.members.find(x=>x.id===m.from);return `<button data-go-team><span class="res-tag">메모</span><span class="res-main"><strong>${esc(String(m.text||"").slice(0,60))}</strong><span>${esc(f?f.name:"알 수 없음")} → ${esc(memberName(m.to))}</span></span></button>`}).join(""):"")+`<div class="eyebrow" style="padding:8px">앞으로 7일</div>`+(up.length?up.map(it=>`<button data-res="item" data-id="${esc(it.id)}"><span class="res-tag" style="background:color-mix(in srgb,${itemColor(it,pm)} 18%,transparent)">${fmtMD(it.eventDate)}</span><span class="res-main"><strong>${esc(it.title)}</strong><span>${esc(it.time||"종일")} · ${esc(pm.get(it.projectId)?.name||"사업 미지정")}</span></span></button>`).join(""):`<div class="empty">7일 안에 예정된 항목이 없습니다.</div>`)}
function openResult(t,id){$("#search-results").hidden=true;$("#bell-panel").hidden=true;$("#search").classList.remove("open");
  if(t==="item"){const it=S.items.find(x=>x.id===id);if(!it)return;S.selected=it.eventDate;S.cursor=new Date(parseISO(it.eventDate).getFullYear(),parseISO(it.eventDate).getMonth(),1);if(S.filter!=="all"&&S.filter!==it.projectId)S.filter="all";go("calendar");render();openItemDialog(it)}
  else if(t==="project"){const p=projects().find(x=>x.id===id);if(p){go("projects");openProjectDetail(p)}}
  else if(t==="note"){const n=S.notes.find(x=>x.id===id);if(n){S.notesProject=n.projectId;S.folderFilter="all";go("notes");render();openNoteEditor(n)}}}

/* ============ global events ============ */
document.addEventListener("click",async e=>{
  const t=e.target;const a=s=>t.closest(s);let el;
  if(!a("#search")&&!$("#search-results").hidden){$("#search-results").hidden=true}
  if(!a("#search"))$("#search").classList.remove("open");
  if(!a("#bell")&&!a("#bell-panel"))$("#bell-panel").hidden=true;
  if((el=a("[data-nav]"))){go(el.dataset.nav);return}
  if((el=a("[data-res]"))){openResult(el.dataset.res,el.dataset.id);return}
  if(a("#bell")){renderBell();$("#bell-panel").hidden=!$("#bell-panel").hidden;return}
  if(a("#search label")&&innerWidth<=480){$("#search").classList.add("open");$("#search-input").focus()}
  if(a("#top-add")){if(S.nav==="projects")openNewProject();else if(S.nav==="team")openMemoDialog();else if(S.nav==="notes"){if(projects().length)openNoteEditor();else openNewProject()}else openItemDialog(null,{kind:"mission"});return}
  if(a("[data-go-team]")){$("#bell-panel").hidden=true;S.msgTab="inbox";if(S.nav==="team")render();else go("team");return}
  if(a("#me-chip")){if(myMember()){S.msgTab="inbox";if(S.nav==="team")render();else go("team")}else openMemberEditor(null);return}
  if(a("[data-logout]")){logout();return}
  if(a("[data-password]")){openPasswordDialog();return}
  if(dlg.contains(t)||$("#confirm").contains(t))return;
  if((el=a("[data-orb-go]"))){const i=+el.dataset.orbGo;if($("#orb")){WR.go(i);if(el.tagName==="TR")$("#orb").scrollIntoView({behavior:"smooth",block:"center"})}else{const p=projects()[i];if(p)openProjectDetail(p)}return}
  if((el=a("[data-orb-step]"))){const d=+el.dataset.orbStep;WR.go(WR.idx+d,d);return}
  if((el=a("[data-orb-tab]"))){WR.tab=el.dataset.orbTab;const card=$(".orb-card");if(card){card.dataset.tab=WR.tab;$$("[data-orb-tab]",card).forEach(b=>b.setAttribute("aria-selected",String(b===el)))}return}
  if(a("[data-orb-cal]")){const p=projects()[WR.idx];if(p){S.filter=p.id;S.expanded.add(p.id);go("calendar")}return}
  if(a("[data-orb-add]")){const p=projects()[WR.idx];if(p)openItemDialog(null,{kind:"event",projectId:p.id,date:todayISO()});return}
  if(a("[data-register]")){openMemberEditor(myMember());return}
  if(a("[data-register-new]")){openMemberEditor(null,true);return}
  if((el=a("[data-switch-me]"))){S.meId=el.dataset.switchMe;saveMe();render();toast(`${memberName(S.meId)}(으)로 전환했습니다`);return}
  if((el=a("[data-memo-to]"))){openMemoDialog(el.dataset.memoTo);return}

    if(d.mmAdd)this.addNode(d.mmAdd);else if(d.mmAlign)this.align(d.mmAlign);else if(d.mmDist)this.distribute(d.mmDist);
    else if(d.mmEdge){this.edgeType=d.mmEdge;if(this.selEdge){const ed=this.edges.find(x=>x.id===this.selEdge);if(ed){ed.type=d.mmEdge;this.changed();return}}this.render()}
    else if(d.mm==="image")$("#mm-file").click();else if(d.mm==="undo")this.undo();else if(d.mm==="redo")this.redo();else if(d.mm==="dup")this.duplicate();else if(d.mm==="snap"){this.snap=!this.snap;this.render()}else if(d.mm==="keys")this.showKeys();
    else if(d.mm==="zin"){const r=this.els.canvas.getBoundingClientRect();this.zoomAt(r.left+r.width/2,r.top+r.height/2,1.25)}else if(d.mm==="zout"){const r=this.els.canvas.getBoundingClientRect();this.zoomAt(r.left+r.width/2,r.top+r.height/2,.8)}else if(d.mm==="fit")this.fit()},
  /* inspector */
  syncSize(){const n=this.single();if(!n)return;const w=$("#mm-w"),h=$("#mm-h");if(w&&document.activeElement!==w)w.value=n.w;if(h&&document.activeElement!==h)h.value=n.h},
  renderInspector(){const el=this.els.insp;if(!el)return;const L=this.selNodes(),n=this.single(),ed=this.edges.find(x=>x.id===this.selEdge);
    const title=L.length>1?`${L.length}개 도형 선택`:n?"도형 설정":ed?"연결선 설정":"편집 도구";let h=`<div><span class="eyebrow">Selection</span><h3>${title}</h3></div>`;
    const layer=`<div class="ibtns"><button data-i="dup">${icon("copy",13)}복제</button><button data-i="front">${icon("front",13)}맨 앞으로</button><button data-i="back">${icon("back",13)}맨 뒤로</button></div>`;
    if(L.length>1){const f=L[0].data;h+=`<div class="isec"><span>정렬 및 균등 간격</span><div class="ibtns g2"><button data-i="al-left">← 좌측</button><button data-i="al-right">우측 →</button><button data-i="al-top">↑ 상단</button><button data-i="al-bottom">하단 ↓</button><button data-i="al-hcenter">↔ 가로 중앙</button><button data-i="al-vcenter">↕ 세로 중앙</button><button data-i="di-h" ${L.length<3?"disabled":""}>가로 균등</button><button data-i="di-v" ${L.length<3?"disabled":""}>세로 균등</button></div></div>
      <div class="isec"><span>선택 도형 채우기 RGB</span>${rgbEditor("fillColor",col(f.fillColor,"#FFFFFF"))}</div><div class="isec"><span>선택 도형 테두리 RGB</span>${rgbEditor("borderColor",col(f.borderColor,"#E73535"))}</div><div class="isec"><span>선택 글씨 RGB</span>${rgbEditor("textColor",col(f.textColor,"#3D1D21"))}</div>${layer}<button class="remove" data-i="del">${icon("trash",14)} 선택 도형 모두 삭제</button>`}
    else if(n){const d=n.data;const fs=clamp(+d.fontSize||12,8,42);h+=`<label class="isec"><span>내용</span><textarea id="mm-label">${esc(d.label)}</textarea><small>Enter 편집 완료 · Shift+Enter 줄바꿈 · F2 편집</small></label>
      <div class="isec"><span>글씨 크기</span><div class="fs-row"><button class="btn sm" data-i="fs-">A−</button><input type="range" min="8" max="42" value="${fs}" id="mm-fs" aria-label="글씨 크기"><b id="mm-fsv">${fs}px</b><button class="btn sm" data-i="fs+">A＋</button></div><div class="ibtns"><button data-i="bold" class="${(d.fontWeight||800)>=700?"on":""}" title="굵게 Ctrl+B"><b>B</b></button><button data-i="italic" class="${d.italic?"on":""}" title="기울임 Ctrl+I"><i>I</i></button><button data-i="underline" class="${d.underline?"on":""}" title="밑줄 Ctrl+U"><u>U</u></button></div></div>
      <div class="isec"><span>글씨 RGB</span>${rgbEditor("textColor",col(d.textColor,"#3D1D21"))}</div>
      <div class="isec"><span>도형 크기</span><div class="wh"><label>W<input type="number" min="80" id="mm-w" value="${n.w}"></label><label>H<input type="number" min="46" id="mm-h" value="${n.h}"></label></div><small>모서리를 드래그해 크기 변경 · Shift를 누르면 비율 유지</small></div>
      <div class="isec"><span>도형 종류</span><div class="ibtns">${SHAPES.map(([k,l,ic])=>`<button data-i="shape" data-shape="${k}" class="${d.shape===k?"on":""}">${icon(ic,13)}${l}</button>`).join("")}</div></div>
      <div class="isec"><span>도형 채우기 RGB</span>${rgbEditor("fillColor",col(d.fillColor,"#FFFFFF"))}</div><div class="isec"><span>도형 테두리 RGB</span>${rgbEditor("borderColor",col(d.borderColor,"#E73535"))}</div>${layer}<button class="remove" data-i="del">${icon("trash",14)} 선택 도형 삭제</button>`}
    else if(ed){h+=`<div class="isec"><span>선 종류</span><div class="ibtns">${[["smoothstep","곡선"],["straight","직선"],["default","자유 곡선"]].map(([k,l])=>`<button data-i="etype" data-et="${k}" class="${ed.type===k?"on":""}">${l}</button>`).join("")}</div></div><div class="isec"><span>연결선 RGB 컬러</span>${rgbEditor("edge",col(ed.color,this.project()?.color||"#E73535"))}</div><button class="remove" data-i="del">${icon("trash",14)} 선택 연결선 삭제</button>`}
    else h+=`<div class="insp-empty">${icon("map",26)}<p>도형을 선택하면 글씨 크기·색상·채우기·테두리를 각각 편집할 수 있습니다.</p><p style="font-size:12px">도형 가장자리의 점을 다른 도형으로 끌면 연결선이 생깁니다.</p></div>`;
    el.innerHTML=h},
  bindInspector(){const el=this.els.insp;
    el.addEventListener("click",e=>{const b=e.target.closest("[data-i]");if(!b||b.disabled)return;const a=b.dataset.i;const n=this.single();
      if(a==="dup")this.duplicate();else if(a==="front")this.layer(true);else if(a==="back")this.layer(false);else if(a==="del")this.removeSel();
      else if(a.startsWith("al-"))this.align(a.slice(3));else if(a.startsWith("di-"))this.distribute(a.slice(3));
      else if(a==="bold"||a==="italic"||a==="underline")this.textStyle(a);
      else if(a==="fs-"||a==="fs+"){if(n){n.data.fontSize=clamp((+n.data.fontSize||12)+(a==="fs+"?1:-1),8,42);this.changed()}}
      else if(a==="shape"){this.selNodes().forEach(x=>x.data.shape=b.dataset.shape);this.changed()}
      else if(a==="etype"){const ed=this.edges.find(x=>x.id===this.selEdge);if(ed){ed.type=b.dataset.et;this.edgeType=b.dataset.et;this.changed()}}});
    el.addEventListener("input",e=>{const t=e.target;const n=this.single();
      if(t.id==="mm-label"&&n){n.data.label=t.value.slice(0,500);this.changed({insp:false});return}
      if(t.id==="mm-fs"&&n){n.data.fontSize=+t.value;$("#mm-fsv").textContent=t.value+"px";this.changed({insp:false});return}
      if((t.id==="mm-w"||t.id==="mm-h")&&n){const v=+t.value;if(!v)return;if(t.id==="mm-w")n.w=Math.max(80,v);else n.h=Math.max(46,v);this.changed({insp:false});return}
      const w=t.closest("[data-rgb]");if(w){const hex=readRgb(w,t);const key=w.dataset.rgb;
        if(key==="edge"){const ed=this.edges.find(x=>x.id===this.selEdge);if(ed){ed.color=hex;this.changed({insp:false})}}
        else{const patch={[key]:hex};if(key==="borderColor")patch.color=hex;this.patchSel(patch)}}});
    el.addEventListener("keydown",e=>{if(e.target.id==="mm-label"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.target.blur();this.els.canvas.focus({preventScroll:true})}});
  }
};

boot();
</script>
</body></html>
